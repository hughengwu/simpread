name: build

# webpack 1 + babel 6 no longer runs on current Node, so the build is pinned to the
# toolchain's own era. The matrix exists to find which versions still work — keep
# fail-fast off so one dead version does not hide a working one.

on:
  push:
    branches: [ '**' ]
    tags:     [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: webpack (node ${{ matrix.node }})
    # 22.04 rather than latest: old Node binaries are happier on the older image
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        node: [ '8', '10', '12', '16' ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: versions
        run: node -v && npm -v

      # no lockfile in the repo, so `npm install` rather than `npm ci`.
      # --legacy-peer-deps is ignored by npm 5/6 and needed by npm 7+.
      - name: install
        run: npm install --no-audit --no-fund --legacy-peer-deps

      # both production builds emit to ./publish and each one cleans it first,
      # so the chrome artifact has to be uploaded before the ext build starts
      - name: build chrome (src)
        run: npm run publish

      - name: chrome output
        if: always()
        run: ls -lR publish || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: simpread-chrome-node${{ matrix.node }}
          path: publish
          if-no-files-found: error

      - name: build ext
        run: npm run ext_pub

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: simpread-ext-node${{ matrix.node }}
          path: publish
          if-no-files-found: error

  # Packages what the matrix already built rather than building again, so the zip that
  # ships is byte for byte the artifact the build job produced. Node 16 is the newest
  # version this toolchain still runs on.
  release:
    name: release
    needs: build
    if: startsWith( github.ref, 'refs/tags/v' )
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: simpread-chrome-node16
          path: chrome

      - name: manifest sanity
        run: |
          test -f chrome/manifest.json
          test -f chrome/sw.js
          node -e 'const m=require("./chrome/manifest.json"); if(m.manifest_version!==3) throw new Error("not MV3"); console.log(m.name, m.version, "MV3 ok")'

      # zip the directory contents, not the directory: Chrome expects manifest.json at
      # the archive root, both for "load unpacked" and for the Web Store
      - name: zip
        run: cd chrome && zip -qr "../simpread-chrome-${GITHUB_REF_NAME}.zip" .

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n\n%s\n' \
            "Unpacked Chrome extension (MV3), built by Actions from $GITHUB_SHA." \
            "Install: unzip, open chrome://extensions, turn on Developer mode, then Load unpacked and pick the unzipped folder." > notes.md
          gh release create "$GITHUB_REF_NAME" "simpread-chrome-${GITHUB_REF_NAME}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md
